<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入戏 · RUXI · Web Prototype</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Extra animations referenced inline */
  @keyframes glitchOverlay {
    0% { opacity: 0; }
    10% { opacity: 1; transform: translate(2px, -2px); }
    20% { transform: translate(-3px, 1px); }
    30% { transform: translate(1px, 2px); }
    50% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes fadeBlink {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes particleDrift {
    from { transform: translate(0, 0); }
    to { transform: translate(20px, -30px); }
  }
  @keyframes flowRight {
    from { left: 0%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to { left: 100%; opacity: 0; }
  }
  @keyframes pulseBadge {
    0%, 100% { box-shadow: 0 0 30px var(--theme-primary), inset 0 0 30px color-mix(in srgb, var(--theme-primary) 40%, transparent); }
    50% { box-shadow: 0 0 50px var(--theme-primary), inset 0 0 40px color-mix(in srgb, var(--theme-primary) 60%, transparent); }
  }
</style>
</head>

<div id="root"></div>
